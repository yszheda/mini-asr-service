[project]
name = "asr"
version = "1.0.0"
description = "轻量级端侧语音识别系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=1.10.0",
    "numpy>=1.20.0",
    "soundfile>=0.12.0",
    "resampy>=0.4.0",
]

[project.scripts]
asr = "asr.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
